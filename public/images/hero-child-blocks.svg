<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe58a"/>
      <stop offset="55%" stop-color="#aeeaff"/>
      <stop offset="100%" stop-color="#74dbff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="220" cy="200" r="120" fill="#ffffff" opacity="0.25"/>
  <circle cx="1420" cy="780" r="160" fill="#ffffff" opacity="0.2"/>
  <circle cx="1300" cy="180" r="90" fill="#ffffff" opacity="0.2"/>

  <!-- simple child silhouette -->
  <circle cx="820" cy="430" r="80" fill="#f7c99b"/>
  <rect x="740" y="500" width="160" height="220" rx="50" fill="#ff6b57"/>
  <rect x="700" y="700" width="90" height="180" rx="30" fill="#0aa8db"/>
  <rect x="810" y="700" width="90" height="180" rx="30" fill="#0aa8db"/>

  <!-- building blocks -->
  <rect x="980" y="760" width="90" height="90" rx="12" fill="#f94d36"/>
  <rect x="1080" y="720" width="90" height="130" rx="12" fill="#f7a800"/>
  <rect x="1180" y="770" width="90" height="80" rx="12" fill="#1cb262"/>
  <rect x="600" y="770" width="90" height="80" rx="12" fill="#0aa8db"/>
  <rect x="500" y="800" width="80" height="50" rx="10" fill="#f7a800"/>

  <text x="50%" y="120" font-family="Verdana, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.85">Happy Child at Play — SKS Classroom</text>
</svg>
